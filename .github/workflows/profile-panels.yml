name: Refresh profile panels
on:
  schedule:
    - cron: '0 13 * * *'
      timezone: America/Toronto
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-panels
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh and publish changed panels
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --depth=1 origin "refs/heads/$TARGET_BRANCH"
            git switch -C refresh-panels FETCH_HEAD
            node .github/scripts/profile-panels.mjs
            git add -- assets/stats.svg assets/contributions.svg assets/languages.svg
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh profile activity panels'
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then exit 0; fi
          done
          exit 1
